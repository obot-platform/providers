name: "${github_auth_provider_name}"
command: "github-auth-provider/bin/obot-provider"
icon: "https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/github.svg"
description: "${github_auth_provider_description}"
link: "https://github.com/"
requiredConfigurationParameters:
  - name: "OBOT_GITHUB_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${github_auth_provider_client_id_friendly_name}"
    description: "${github_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_GITHUB_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${github_auth_provider_client_secret_friendly_name}"
    description: "${github_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${github_auth_provider_cookie_secret_friendly_name}"
    description: "${github_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${github_auth_provider_email_domains_friendly_name}"
    description: "${github_auth_provider_email_domains_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${github_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${github_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${github_auth_provider_postgres_max_connections_friendly_name}"
    description: "${github_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${github_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${github_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${github_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${github_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "${github_auth_provider_token_refresh_duration_friendly_name}"
    description: "${github_auth_provider_token_refresh_duration_description}"
    sensitive: false
  - name: "OBOT_GITHUB_AUTH_PROVIDER_ORG"
    friendlyName: "${github_auth_provider_org_friendly_name}"
    description: "${github_auth_provider_org_description}"
    sensitive: false
  - name: "OBOT_GITHUB_AUTH_PROVIDER_ALLOW_USERS"
    friendlyName: "${github_auth_provider_allow_users_friendly_name}"
    description: "${github_auth_provider_allow_users_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "${github_auth_provider_enable_logging_friendly_name}"
    description: "${github_auth_provider_enable_logging_description}"
    sensitive: false
postgresTablePrefix: "github_"
