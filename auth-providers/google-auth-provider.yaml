name: "${google_auth_provider_name}"
command: "google-auth-provider/bin/obot-provider"
icon: "/admin/assets/google_icon_small.png"
iconDark: "/admin/assets/google_icon_small.png"
description: "${google_auth_provider_description}"
link: "https://google.com/"
requiredConfigurationParameters:
  - name: "OBOT_GOOGLE_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${google_auth_provider_client_id_friendly_name}"
    description: "${google_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_GOOGLE_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${google_auth_provider_client_secret_friendly_name}"
    description: "${google_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${google_auth_provider_cookie_secret_friendly_name}"
    description: "${google_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${google_auth_provider_email_domains_friendly_name}"
    description: "${google_auth_provider_email_domains_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${google_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${google_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${google_auth_provider_postgres_max_connections_friendly_name}"
    description: "${google_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${google_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${google_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${google_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${google_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "${google_auth_provider_token_refresh_duration_friendly_name}"
    description: "${google_auth_provider_token_refresh_duration_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "${google_auth_provider_enable_logging_friendly_name}"
    description: "${google_auth_provider_enable_logging_description}"
    sensitive: false
postgresTablePrefix: "google_"
