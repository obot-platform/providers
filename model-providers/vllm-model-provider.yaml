name: "${vllm_model_provider_name}"
command: "vllm-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/vllm-logo.svg"
iconDark: "/admin/assets/vllm-logo.svg"
description: "${vllm_model_provider_description}"
link: "https://docs.vllm.ai/"
requiredConfigurationParameters:
  - name: "OBOT_VLLM_MODEL_PROVIDER_ENDPOINT"
    friendlyName: "${vllm_model_provider_endpoint_friendly_name}"
    description: "${vllm_model_provider_endpoint_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_VLLM_MODEL_PROVIDER_API_KEY"
    friendlyName: "${vllm_model_provider_api_key_friendly_name}"
    description: "${vllm_model_provider_api_key_description}"
    sensitive: true
