name: "${generic_openai_model_provider_name}"
command: "generic-openai-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/obot_openai_antenna_icon.png"
iconDark: "/admin/assets/obot_openai_antenna_icon.png"
description: "${generic_openai_model_provider_description}"
link: "https://platform.openai.com/docs/api-reference/introduction"
requiredConfigurationParameters:
  - name: "OBOT_GENERIC_OPENAI_MODEL_PROVIDER_BASE_URL"
    friendlyName: "${generic_openai_model_provider_base_url_friendly_name}"
    description: "${generic_openai_model_provider_base_url_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_GENERIC_OPENAI_MODEL_PROVIDER_API_KEY"
    friendlyName: "${generic_openai_model_provider_api_key_friendly_name}"
    description: "${generic_openai_model_provider_api_key_description}"
    sensitive: true
