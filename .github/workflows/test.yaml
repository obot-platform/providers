name: Build and test

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build providers
        run: make build

      - name: Run tests
        run: make test

      - name: Run vet
        run: make vet
